<!doctype html>
<!--
  Source template for public/og-image.png (1200x630).
  Regenerate after editing: open in a 1200x630 viewport and screenshot.
  Mirrors the site hero: Outfit font, design tokens from app/globals.css.
  Subtitle intentionally differs from the page ("Enterprise software
  engineering, AI-first.") — OG cards use shorter, location-anchored copy.
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300&display=swap"
			rel="stylesheet"
		/>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			html,
			body {
				width: 1200px;
				height: 630px;
			}
			body {
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				background: #fafaf8;
				font-family: 'Outfit', sans-serif;
				-webkit-font-smoothing: antialiased;
				text-rendering: geometricPrecision;
			}
			.name {
				font-weight: 200;
				font-size: 72px;
				letter-spacing: -0.02em;
				color: #111;
				line-height: 1;
			}
			.divider {
				width: 72px;
				height: 1px;
				background: #d8d6d2;
				margin: 32px 0;
			}
			.subtitle {
				font-weight: 300;
				font-size: 30px;
				letter-spacing: 0.01em;
				color: #555;
			}
		</style>
	</head>
	<body>
		<div class="name">Artem Polovyi</div>
		<div class="divider"></div>
		<div class="subtitle">Enterprise engineer in Zurich.</div>
	</body>
</html>
