name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate dictionaries
        run: npm run validate:dictionaries

      - name: Validate career data
        run: npm run validate:career-data

      - name: Check dictionaries are in sync
        run: |
          npm run generate:dictionaries
          git diff --exit-code dictionaries/ || (echo "Error: Dictionaries are out of sync. Run 'npm run generate:dictionaries' locally and commit the changes." && exit 1)

      - name: Prettier check
        run: npm run format:check

      - name: Lint (CI strict)
        run: npm run lint:ci

      - name: Build
        run: npm run build
