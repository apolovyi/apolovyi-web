name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate dictionaries
        run: npm run validate:dictionaries

      - name: Prettier check
        run: npm run format:check

      - name: Lint (CI strict)
        run: npm run lint:ci

      - name: Build
        run: npm run build


      - name: Lighthouse collect (desktop)
        run: |
          rm -rf .lighthouseci || true
          npx @lhci/cli collect --config=./lighthouserc.desktop.json

      - name: Lighthouse summary (desktop)
        run: node scripts/print-lhci-summary.mjs

      - name: Upload Lighthouse artifacts (desktop)
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-desktop
          path: .lighthouseci

      - name: Lighthouse assert (desktop)
        run: npx @lhci/cli assert --config=./lighthouserc.desktop.json

      - name: Lighthouse collect (mobile)
        run: |
          rm -rf .lighthouseci || true
          npx @lhci/cli collect --config=./lighthouserc.mobile.json

      - name: Lighthouse summary (mobile)
        run: node scripts/print-lhci-summary.mjs

      - name: Upload Lighthouse artifacts (mobile)
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-mobile
          path: .lighthouseci

      - name: Lighthouse assert (mobile)
        run: npx @lhci/cli assert --config=./lighthouserc.mobile.json
