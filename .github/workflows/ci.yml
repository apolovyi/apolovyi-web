name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate dictionaries
        run: pnpm run validate:dictionaries

      - name: Validate career data
        run: pnpm run validate:career-data

      - name: Check dictionaries are in sync
        run: |
          pnpm run generate:dictionaries
          git diff --exit-code dictionaries/ || (echo "Error: Dictionaries are out of sync. Run 'pnpm run generate:dictionaries' locally and commit the changes." && exit 1)

      - name: Prettier check
        run: pnpm run format:check

      - name: Lint (CI strict)
        run: pnpm run lint:ci

      - name: Build
        run: pnpm run build
