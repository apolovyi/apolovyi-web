name: Validate dictionaries

on:
  push:
    branches: [main]
    paths:
      - 'dictionaries/**'
      - 'scripts/validateDictionaries.js'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'dictionaries/**'
      - 'scripts/validateDictionaries.js'
      - 'package.json'
      - 'package-lock.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate dictionaries
        run: npm run validate:dictionaries

