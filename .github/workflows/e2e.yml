name: E2E Tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, ready_for_review]
  workflow_dispatch:
    inputs:
      test_level:
        description: 'Test coverage level'
        required: true
        default: 'core'
        type: choice
        options:
          - core
          - full

env:
  CI: true
  CORE_PROJECTS: '--project=chrome-desktop --project=safari-desktop --project=iphone-15'

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup pnpm
        run: npm install --global "$(node --print "require('./package.json').packageManager")"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .next/cache
            out
          key: nextjs-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.js', '**/*.jsx', '!e2e/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Build application
        run: pnpm run build

      - name: Determine test scope
        id: test-scope
        run: |
          IS_DRAFT="${{ github.event.pull_request.draft }}"
          HAS_FULL_LABEL="${{ contains(github.event.pull_request.labels.*.name, 'test:full') }}"
          IS_MANUAL_FULL="${{ github.event_name == 'workflow_dispatch' && inputs.test_level == 'full' }}"

          if [[ "$IS_MANUAL_FULL" == "true" ]]; then
            echo "projects=" >> "$GITHUB_OUTPUT"
            echo "scope=full" >> "$GITHUB_OUTPUT"
          elif [[ "$HAS_FULL_LABEL" == "true" ]]; then
            echo "projects=" >> "$GITHUB_OUTPUT"
            echo "scope=full" >> "$GITHUB_OUTPUT"
          elif [[ "$IS_DRAFT" != "true" ]]; then
            echo "projects=" >> "$GITHUB_OUTPUT"
            echo "scope=full" >> "$GITHUB_OUTPUT"
          else
            echo "projects=$CORE_PROJECTS" >> "$GITHUB_OUTPUT"
            echo "scope=core" >> "$GITHUB_OUTPUT"
          fi

      - name: Run E2E tests (${{ steps.test-scope.outputs.scope }})
        run: pnpm exec playwright test ${{ steps.test-scope.outputs.projects }}

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: playwright-report-${{ steps.test-scope.outputs.scope }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
